<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My CS180 Portfolio</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            background-color: #f4f7f6;
        }
        header {
            text-align: center;
            margin-bottom: 50px;
        }
        h1 { color: #2c3e50; }
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .project-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
            text-decoration: none;
            color: #333;
            display: block;
        }
        .project-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        .project-card h2 { margin-top: 0; color: #3498db; }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My CS180 Portfolio</h1>
        <p>Exploring Computer Vision and Computational Photography</p>
    </header>

    <div class="project-grid">
        <!-- Project 0 Card -->
        <a href="./0/index.html" class="project-card">
            <h2>Project 0</h2>
            <p> Get familiar with your camera!</p>
        </a>
        
    </div>

</body>
</html>
